<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCM — Tareas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F0EDE6;--surface:#FAFAF7;--border:#D9D4C8;
  --text:#2C3E6B;--text2:#4A5568;--text3:#8A9BB5;
  --muro:#B8860B;--muro-bg:#FFF8E7;--muro-head:#F5E6B8;
  --juv:#2E7D32;--juv-bg:#EBF5EB;--juv-head:#C8E6C9;
  --personal:#3949AB;--personal-bg:#EEF2FF;--personal-head:#C5CAE9;
  --overdue-bg:#FFF0F0;--overdue-border:#FFCDD2;--overdue-text:#C62828;
  --today-bg:#FFF8E1;--today-border:#FFE082;--today-text:#E65100;
  --green:#2E7D32;--shadow:0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.14);
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* Auth */
#auth-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1.5rem;text-align:center;padding:2rem;}
#auth-screen h2{font-size:24px;font-weight:800;color:var(--text);}
#auth-screen p{font-size:14px;color:var(--text2);max-width:320px;line-height:1.6;}
.btn-auth{height:48px;padding:0 28px;background:var(--text);color:white;border:none;border-radius:var(--radius-sm);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;transition:opacity 0.15s;}
.btn-auth:hover{opacity:0.88;}
.auth-note{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);}

/* Layout */
#main-app{display:none;}
.layout{display:flex;min-height:100vh;transition:all 0.3s;}
.main-panel{flex:1;padding:1.5rem;min-width:0;transition:all 0.3s;}
.side-panel{width:0;overflow:hidden;transition:width 0.3s ease;background:white;border-left:1px solid var(--border);box-shadow:var(--shadow-lg);position:sticky;top:0;height:100vh;flex-shrink:0;}
.side-panel.open{width:380px;}

/* Header */
.app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px;}
.header-left h1{font-size:20px;font-weight:800;color:var(--text);}
.header-left .subtitle{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;}
.sync-pill{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);background:white;border:1px solid var(--border);border-radius:99px;padding:5px 12px;box-shadow:var(--shadow);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.dot.syncing{background:#E65100;animation:pulse 1s infinite;}
.dot.error{background:#C62828;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.btn-signout{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;text-decoration:underline;}

/* Add task */
.add-card{background:white;border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.5rem;box-shadow:var(--shadow);}
.add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.add-row input[type=text]{flex:2;min-width:180px;height:38px;border:1.5px solid var(--border);border-radius:var(--radius-xs);background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:500;padding:0 12px;outline:none;transition:border-color 0.15s;}
.add-row input[type=text]:focus{border-color:var(--text);}
.add-row input[type=text]::placeholder{color:var(--text3);}
.add-row select{height:38px;border:1.5px solid var(--border);border-radius:var(--radius-xs);background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;padding:0 10px;outline:none;cursor:pointer;}
.due-group{display:flex;align-items:center;gap:6px;}
.due-group label{font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap;}
.due-group input[type=date]{height:38px;border:1.5px solid var(--border);border-radius:var(--radius-xs);background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:0 10px;outline:none;}
.btn-add{height:38px;padding:0 18px;background:var(--text);color:white;border:none;border-radius:var(--radius-xs);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity 0.15s;}
.btn-add:hover{opacity:0.88;}
.btn-copy{width:100%;height:32px;background:transparent;border:1.5px dashed var(--border);border-radius:var(--radius-xs);font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);cursor:pointer;margin-top:8px;transition:all 0.15s;}
.btn-copy:hover{border-color:var(--text);color:var(--text);}

/* Section headers */
.section-header{display:flex;align-items:center;gap:10px;margin:1.5rem 0 10px;}
.section-badge{font-size:13px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;padding:4px 14px;border-radius:99px;}
.section-muro{background:var(--muro-head);color:var(--muro);}
.section-juv{background:var(--juv-head);color:var(--juv);}
.section-personal{background:var(--personal-head);color:var(--personal);}
.section-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);}
.section-line{flex:1;height:1px;background:var(--border);}

/* Sticky notes grid */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:8px;}

/* Sticky note */
.note{border-radius:var(--radius-sm);padding:14px;cursor:pointer;border:2px solid transparent;box-shadow:0 3px 10px rgba(0,0,0,0.08),0 1px 3px rgba(0,0,0,0.06);transition:all 0.18s;position:relative;min-height:110px;display:flex;flex-direction:column;gap:8px;}
.note:hover{box-shadow:0 6px 20px rgba(0,0,0,0.13);transform:translateY(-2px) rotate(0.3deg);}
.note.active{border-color:var(--text);box-shadow:0 6px 20px rgba(44,62,107,0.2);}
.note.overdue{background:var(--overdue-bg)!important;border-color:var(--overdue-border)!important;}
.note.due-today{background:var(--today-bg)!important;border-color:var(--today-border)!important;}
.note.done{opacity:0.45;transform:none!important;}
.note-muro{background:var(--muro-bg);}
.note-juv{background:var(--juv-bg);}
.note-personal{background:var(--personal-bg);}
.note-check-row{display:flex;align-items:flex-start;gap:8px;}
.note-check{width:17px;height:17px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;margin-top:1px;transition:all 0.15s;background:white;}
.note-check.checked{background:var(--green);border-color:var(--green);color:white;}
.note-text{font-size:13px;font-weight:700;color:var(--text);line-height:1.4;flex:1;word-break:break-word;}
.note-text.done-text{text-decoration:line-through;color:var(--text3);}
.note-footer{margin-top:auto;display:flex;flex-direction:column;gap:4px;}
.note-due{font-family:'DM Mono',monospace;font-size:10px;font-weight:600;padding:2px 7px;border-radius:99px;display:inline-block;width:fit-content;}
.note-due.overdue{background:var(--overdue-border);color:var(--overdue-text);}
.note-due.today{background:var(--today-border);color:var(--today-text);}
.note-due.future{background:#E8F5E9;color:#2E7D32;}
.note-cap{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);}

/* Completed row */
.done-toggle-btn{background:none;border:none;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.done-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}

/* Side panel */
.side-inner{padding:1.5rem;height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
.side-close{display:flex;justify-content:flex-end;}
.btn-close{background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;padding:0 4px;line-height:1;}
.btn-close:hover{color:var(--text);}
.side-emp-badge{font-size:12px;font-weight:800;letter-spacing:0.05em;text-transform:uppercase;padding:4px 14px;border-radius:99px;display:inline-block;}
.side-title{font-size:20px;font-weight:800;color:var(--text);line-height:1.4;}
.side-due-block{display:flex;flex-direction:column;gap:4px;}
.side-due-label{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;}
.side-due-val{font-family:'DM Mono',monospace;font-size:14px;font-weight:600;}
.side-due-val.overdue{color:var(--overdue-text);}
.side-due-val.today{color:var(--today-text);}
.side-due-val.future{color:var(--green);}
.side-divider{height:1px;background:var(--border);}
.side-actions{display:flex;flex-direction:column;gap:8px;}
.btn-done-toggle{height:40px;border-radius:var(--radius-xs);border:none;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.btn-mark-done{background:#E8F5E9;color:var(--green);}
.btn-mark-done:hover{background:#C8E6C9;}
.btn-mark-undone{background:#FFF3E0;color:#E65100;}
.btn-mark-undone:hover{background:#FFE0B2;}
.btn-del-task{height:40px;border-radius:var(--radius-xs);border:1.5px solid var(--overdue-border);background:white;color:var(--overdue-text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.15s;}
.btn-del-task:hover{background:var(--overdue-bg);}

/* Edit form in side panel */
.edit-form{display:flex;flex-direction:column;gap:10px;}
.edit-form label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px;display:block;}
.edit-form input[type=text],.edit-form select,.edit-form input[type=date]{width:100%;height:40px;border:1.5px solid var(--border);border-radius:var(--radius-xs);background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;font-size:14px;font-weight:500;padding:0 12px;outline:none;transition:border-color 0.15s;}
.edit-form input[type=text]:focus,.edit-form select:focus,.edit-form input[type=date]:focus{border-color:var(--text);}
.edit-form input[type=date]{font-family:'DM Mono',monospace;font-size:13px;}
.btn-save-edit{height:40px;background:var(--text);color:white;border:none;border-radius:var(--radius-xs);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:opacity 0.15s;}
.btn-save-edit:hover{opacity:0.88;}

/* Loading */
.loading{text-align:center;padding:3rem;color:var(--text3);}
.loading-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--text3);margin:0 3px;animation:bounce 1.2s infinite;}
.loading-dot:nth-child(2){animation-delay:0.2s;}
.loading-dot:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
.btn-analyze{width:100%;margin-top:1.5rem;height:38px;background:transparent;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Mono',monospace;font-size:11px;color:var(--text2);cursor:pointer;transition:all 0.15s;box-shadow:var(--shadow);}
.btn-analyze:hover{border-color:var(--text);color:var(--text);}
@media(max-width:700px){.side-panel.open{width:100%;position:fixed;top:0;left:0;height:100vh;z-index:100;border-left:none;}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth-screen">
  <div style="font-size:36px">📋</div>
  <h2>Tablero de tareas JCM</h2>
  <p>Conecta tu cuenta de Google para guardar tus tareas en Drive.</p>
  <button class="btn-auth" id="btn-signin">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#fff" d="M9 3.48c1.69 0 2.83.73 3.48 1.34l2.54-2.48C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l2.91 2.26C4.6 5.05 6.62 3.48 9 3.48z"/><path fill="#fff" d="M17.64 9.2c0-.74-.06-1.28-.19-1.84H9v3.34h4.96c-.1.83-.64 2.08-1.84 2.92l2.84 2.2c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#fff" d="M3.88 10.78A5.54 5.54 0 0 1 3.58 9c0-.62.11-1.22.29-1.78L.96 4.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.04l2.92-2.26z"/><path fill="#fff" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.84-2.2c-.76.53-1.78.9-3.12.9-2.38 0-4.4-1.57-5.12-3.74L.87 13.04C2.35 15.98 5.48 18 9 18z"/></svg>
    Conectar con Google
  </button>
  <span class="auth-note">Tus datos se guardan automáticamente en Drive.</span>
</div>

<!-- MAIN -->
<div id="main-app">
<div class="layout">

  <!-- MAIN PANEL -->
  <div class="main-panel">
    <div class="app-header">
      <div class="header-left">
        <h1>📋 Tablero de tareas</h1>
        <div class="subtitle" id="today-str"></div>
      </div>
      <div class="header-right">
        <div class="sync-pill"><span class="dot" id="sync-dot"></span><span id="sync-label">Sincronizado</span></div>
        <button class="btn-signout" onclick="signOut()">Cerrar sesión</button>
      </div>
    </div>

    <div class="add-card">
      <div class="add-row">
        <input type="text" id="task-input" placeholder="Describir tarea nueva..." />
        <select id="emp-sel">
          <option value="MURO">MURO</option>
          <option value="Juvenia">Juvenia</option>
          <option value="Personal">Personal</option>
        </select>
        <div class="due-group">
          <label for="due-input">Vence:</label>
          <input type="date" id="due-input" />
        </div>
        <button class="btn-add" onclick="addTask()">+ Agregar</button>
      </div>
      <button class="btn-copy" onclick="copyForClaude()">↗ Copiar pendientes para pegar en Claude</button>
    </div>

    <div id="board">
      <div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>
    </div>

    <button class="btn-analyze" onclick="copyAnalysis()">↗ Copiar lista completa para análisis en Claude</button>
  </div>

  <!-- SIDE PANEL -->
  <div class="side-panel" id="side-panel">
    <div class="side-inner" id="side-inner"></div>
  </div>

</div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>
<script>
const CLIENT_ID='447980727079-lqcq34utcq00h5s6fuq3bnnq2n2tlb9s.apps.googleusercontent.com';
const SCOPES='https://www.googleapis.com/auth/drive.appdata';
const DATA_FILE='jcm_tasks_data.json';
let tasks=[],tokenClient,gapiReady=false,gisReady=false,driveFileId=null,saveTimeout=null,activeId=null;

function gapiLoaded(){gapi.load('client',async()=>{await gapi.client.init({discoveryDocs:['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest']});gapiReady=true;maybeInit();});}
window.onload=()=>{if(typeof google!=='undefined'&&google.accounts){initGIS();}else{const s=document.querySelector('script[src*="gsi"]');if(s)s.addEventListener('load',initGIS);}};
function initGIS(){tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:async(resp)=>{if(resp.error){setSyncStatus('error');return;}showApp();await loadFromDrive();}});gisReady=true;maybeInit();}
function maybeInit(){if(!gapiReady||!gisReady)return;const tok=localStorage.getItem('jcm_gtoken');if(tok){gapi.client.setToken(JSON.parse(tok));showApp();loadFromDrive();}}
document.getElementById('btn-signin').addEventListener('click',()=>{if(!gisReady){alert('Cargando...');return;}tokenClient.requestAccessToken({prompt:'consent'});});
function signOut(){const t=gapi.client.getToken();if(t)google.accounts.oauth2.revoke(t.access_token);gapi.client.setToken('');localStorage.removeItem('jcm_gtoken');document.getElementById('main-app').style.display='none';document.getElementById('auth-screen').style.display='flex';closeSide();}
function showApp(){document.getElementById('auth-screen').style.display='none';document.getElementById('main-app').style.display='block';document.getElementById('today-str').textContent=new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const t=gapi.client.getToken();if(t)localStorage.setItem('jcm_gtoken',JSON.stringify(t));}

async function findOrCreateDataFile(){const r=await gapi.client.drive.files.list({spaces:'appDataFolder',q:"name='"+DATA_FILE+"'",fields:'files(id)'});if(r.result.files&&r.result.files.length>0){driveFileId=r.result.files[0].id;}else{const c=await gapi.client.drive.files.create({resource:{name:DATA_FILE,parents:['appDataFolder']},fields:'id'});driveFileId=c.result.id;}return driveFileId;}
async function loadFromDrive(){setSyncStatus('syncing');try{await findOrCreateDataFile();const r=await gapi.client.drive.files.get({fileId:driveFileId,alt:'media'});tasks=r.body&&r.body.trim()?JSON.parse(r.body):[];setSyncStatus('ok');}catch(e){tasks=[];setSyncStatus('error');}render();}
async function saveToDrive(){setSyncStatus('syncing');try{if(!driveFileId)await findOrCreateDataFile();const token=gapi.client.getToken().access_token;const blob=new Blob([JSON.stringify(tasks)],{type:'application/json'});const meta=new Blob([JSON.stringify({name:DATA_FILE})],{type:'application/json'});const form=new FormData();form.append('metadata',meta);form.append('file',blob);await fetch('https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=multipart',{method:'PATCH',headers:{Authorization:'Bearer '+token},body:form});setSyncStatus('ok');}catch(e){setSyncStatus('error');}}
function scheduleSave(){clearTimeout(saveTimeout);saveTimeout=setTimeout(saveToDrive,800);}

function todayISO(){return new Date().toISOString().split('T')[0];}
function fmtDate(iso){if(!iso)return'Sin fecha';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y;}
function captureFmt(){return new Date().toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'numeric'});}
function setSyncStatus(s){const dot=document.getElementById('sync-dot'),lbl=document.getElementById('sync-label');if(!dot)return;dot.className='dot'+(s==='syncing'?' syncing':s==='error'?' error':'');lbl.textContent=s==='syncing'?'Guardando...':s==='error'?'Error':'Sincronizado';}
function dueStatus(t){if(!t.due)return null;const td=todayISO();if(t.due<td)return'overdue';if(t.due===td)return'today';return'future';}

function addTask(){const inp=document.getElementById('task-input'),text=inp.value.trim();if(!text){inp.focus();return;}tasks.push({id:Date.now(),text,empresa:document.getElementById('emp-sel').value,done:false,fecha:captureFmt(),capturedAt:Date.now(),due:document.getElementById('due-input').value||null});inp.value='';document.getElementById('due-input').value='';inp.focus();scheduleSave();render();}
document.getElementById('task-input').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});

function toggleDone(id){const t=tasks.find(x=>x.id===id);if(t){t.done=!t.done;scheduleSave();render();if(activeId===id)openSide(id);}}
function deleteTask(id){if(!confirm('¿Eliminar esta tarea?'))return;tasks=tasks.filter(x=>x.id!==id);if(activeId===id)closeSide();scheduleSave();render();}

function saveEdit(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const txt=document.getElementById('se-text').value.trim();
  if(!txt)return;
  t.text=txt;
  t.empresa=document.getElementById('se-emp').value;
  t.due=document.getElementById('se-due').value||null;
  scheduleSave();render();openSide(id);
}

function sortTasks(arr){
  return arr.slice().sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    const order={overdue:0,today:1,future:2};
    const oa=order[dueStatus(a)]??3,ob=order[dueStatus(b)]??3;
    if(oa!==ob)return oa-ob;
    if(a.due&&b.due)return a.due.localeCompare(b.due);
    if(a.due)return-1;if(b.due)return 1;
    return(a.capturedAt||0)-(b.capturedAt||0);
  });
}

function noteHTML(t){
  const ds=dueStatus(t);
  let cls='note note-'+t.empresa.toLowerCase().replace('juvenia','juv');
  if(t.empresa==='Juvenia')cls='note note-juv';
  if(t.empresa==='MURO')cls='note note-muro';
  if(t.empresa==='Personal')cls='note note-personal';
  if(!t.done){if(ds==='overdue')cls+=' overdue';else if(ds==='today')cls+=' due-today';}
  if(t.done)cls+=' done';
  if(t.id===activeId)cls+=' active';
  let dueBadge='';
  if(t.due){
    if(ds==='overdue')dueBadge='<div class="note-due overdue">⚠ Vencida '+fmtDate(t.due)+'</div>';
    else if(ds==='today')dueBadge='<div class="note-due today">🔔 Hoy</div>';
    else dueBadge='<div class="note-due future">'+fmtDate(t.due)+'</div>';
  }
  return`<div class="${cls}" onclick="openSide(${t.id})">
    <div class="note-check-row">
      <div class="note-check${t.done?' checked':''}" onclick="event.stopPropagation();toggleDone(${t.id})">${t.done?'✓':''}</div>
      <div class="note-text${t.done?' done-text':''}">${t.text}</div>
    </div>
    <div class="note-footer">${dueBadge}<div class="note-cap">Cap. ${t.fecha}</div></div>
  </div>`;
}

function sectionHTML(empresa,cssKey,color){
  const all=sortTasks(tasks.filter(t=>t.empresa===empresa));
  const pending=all.filter(t=>!t.done);
  const done=all.filter(t=>t.done);
  if(!all.length)return'';
  let html=`<div class="section-header"><span class="section-badge section-${cssKey}">${empresa}</span><span class="section-count">${pending.length} pendiente${pending.length!==1?'s':''}</span><span class="section-line"></span></div>`;
  html+=`<div class="notes-grid">${pending.length?pending.map(noteHTML).join(''):'<div style="font-size:13px;color:var(--text3);font-style:italic;padding:8px 0;">Sin pendientes 🎉</div>'}</div>`;
  if(done.length){
    html+=`<button class="done-toggle-btn" onclick="var g=this.nextElementSibling;g.style.display=g.style.display==='grid'?'none':'grid';this.querySelector('span').textContent=g.style.display==='grid'?'▼ ':'▶ ';"><span>▶ </span>Completadas (${done.length})</button>`;
    html+=`<div class="done-grid" style="display:none;">${done.map(noteHTML).join('')}</div>`;
  }
  return html;
}

function render(){
  document.getElementById('board').innerHTML=sectionHTML('MURO','muro','--muro')+sectionHTML('Juvenia','juv','--juv')+sectionHTML('Personal','personal','--personal');
  if(activeId)openSide(activeId);
}

function openSide(id){
  activeId=id;
  const t=tasks.find(x=>x.id===id);
  if(!t){closeSide();return;}
  const ds=dueStatus(t);
  const panel=document.getElementById('side-panel');
  panel.classList.add('open');
  const empColor=t.empresa==='MURO'?'section-muro':t.empresa==='Juvenia'?'section-juv':'section-personal';
  let dueHTML='<div class="side-due-label">Fecha de vencimiento</div>';
  if(t.due){
    const cls=ds==='overdue'?'overdue':ds==='today'?'today':'future';
    const label=ds==='overdue'?'⚠ Vencida '+fmtDate(t.due):ds==='today'?'🔔 Hoy — '+fmtDate(t.due):fmtDate(t.due);
    dueHTML+=`<div class="side-due-val ${cls}">${label}</div>`;
  }else{dueHTML+='<div class="side-due-val" style="color:var(--text3)">Sin fecha asignada</div>';}
  const doneBtn=t.done
    ?`<button class="btn-done-toggle btn-mark-undone" onclick="toggleDone(${id})">↩ Marcar como pendiente</button>`
    :`<button class="btn-done-toggle btn-mark-done" onclick="toggleDone(${id})">✓ Marcar como completada</button>`;
  document.getElementById('side-inner').innerHTML=`
    <div class="side-close"><button class="btn-close" onclick="closeSide()">✕</button></div>
    <span class="section-badge ${empColor}">${t.empresa}</span>
    <div class="side-title">${t.text}</div>
    <div class="side-due-block">${dueHTML}</div>
    <div class="side-due-block"><div class="side-due-label">Capturada</div><div class="side-due-val" style="color:var(--text3);font-size:13px;">${t.fecha}</div></div>
    <div class="side-divider"></div>
    <div class="side-actions">${doneBtn}<button class="btn-del-task" onclick="deleteTask(${id})">🗑 Eliminar tarea</button></div>
    <div class="side-divider"></div>
    <div class="edit-form">
      <div><label>Editar nombre</label><input type="text" id="se-text" value="${t.text.replace(/"/g,'&quot;')}"/></div>
      <div><label>Empresa</label>
        <select id="se-emp">
          <option${t.empresa==='MURO'?' selected':''}>MURO</option>
          <option${t.empresa==='Juvenia'?' selected':''}>Juvenia</option>
          <option${t.empresa==='Personal'?' selected':''}>Personal</option>
        </select>
      </div>
      <div><label>Fecha de vencimiento</label><input type="date" id="se-due" value="${t.due||''}"/></div>
      <button class="btn-save-edit" onclick="saveEdit(${id})">Guardar cambios</button>
    </div>`;
  // highlight active note
  document.querySelectorAll('.note').forEach(n=>n.classList.remove('active'));
  const noteEl=document.getElementById('note-'+id);
  if(noteEl)noteEl.classList.add('active');
}

function closeSide(){activeId=null;document.getElementById('side-panel').classList.remove('open');document.querySelectorAll('.note').forEach(n=>n.classList.remove('active'));}

function copyForClaude(){const p=tasks.filter(t=>!t.done);if(!p.length){alert('No tienes tareas pendientes.');return;}const list=p.map(t=>'['+t.empresa+']'+(t.due?' [Vence:'+fmtDate(t.due)+']':'')+' '+t.text).join('\n');const text='Revisión diaria de pendientes. Estas son mis tareas activas:\n\n'+list+'\n\nAyúdame a priorizar qué atacar hoy y qué puedo postergar.';navigator.clipboard.writeText(text).then(()=>alert('Copiado. Pégalo en Claude.')).catch(()=>prompt('Copia esto:',text));}
function copyAnalysis(){const all=tasks.map(t=>'['+t.empresa+']['+(t.done?'HECHO':'PENDIENTE')+']'+(t.due?' [Vence:'+fmtDate(t.due)+']':'')+' '+t.text).join('\n');const text='Analiza mis pendientes y dime si hay algo que debería replantear, delegar o eliminar:\n\n'+all;navigator.clipboard.writeText(text).then(()=>alert('Copiado. Pégalo en Claude.')).catch(()=>prompt('Copia esto:',text));}
</script>
</body>
</html>
